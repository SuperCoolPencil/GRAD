name: EAS Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build_and_release:
    name: Build APK (and Release if Tagged)
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install Dependencies
        run: npm ci

      # ----------------------------------------------------------------
      # BUILD STEP
      # Changed output to .apk
      # Ensure your eas.json profile has "buildType": "apk"
      # ----------------------------------------------------------------
      - name: 🚀 Build Android APK Locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local \
            --platform android \
            --profile preview \
            --output=./grad.apk

      # ----------------------------------------------------------------
      # ARTIFACT UPLOAD
      # ----------------------------------------------------------------
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grad
          path: ./grad.apk
          retention-days: 14

      # ----------------------------------------------------------------
      # RELEASE STEP
      # ----------------------------------------------------------------
      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./grad.apk
          draft: false
          prerelease: false
          generate_release_notes: true
