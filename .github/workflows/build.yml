name: EAS Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# 1. PERMISSIONS: Required to allow the Action to push the new commit
permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK (and Release if Tagged)
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v4
        with:
          # Required for the auto-commit action to work correctly
          ref: ${{ github.head_ref }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install Dependencies
        run: npm ci

      # ----------------------------------------------------------------
      # BUILD STEP
      # ----------------------------------------------------------------
      - name: 🚀 Build Android APK Locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output=./grad.apk

      # ----------------------------------------------------------------
      # FORCE ADD & COMMIT STEP
      # ----------------------------------------------------------------
      - name: ➕ Force Add APK (Bypass .gitignore)
        if: github.ref == 'refs/heads/main'
        run: |
          # Force add the file because .apk is likely in your .gitignore
          git add -f grad.apk

      - name: 💾 Commit and Push APK
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update grad.apk build [skip ci]"
          # No file_pattern needed here because we manually staged it above

      # ----------------------------------------------------------------
      # RELEASE STEP (Tags Only)
      # ----------------------------------------------------------------
      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./grad.apk
          draft: false
          prerelease: false
          generate_release_notes: true
