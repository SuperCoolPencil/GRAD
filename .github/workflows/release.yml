name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not match semver format vX.Y.Z"
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          tag_version="${RELEASE_TAG#v}"
          app_version=$(node -p "require('./app.json').expo.version")
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag version ($tag_version) does not match app.json version ($app_version)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build signed Android APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PRODUCTION: '1'
        run: |
          test -n "$EXPO_TOKEN"
          eas build --local --platform android --profile production --non-interactive --output "$GITHUB_WORKSPACE/grad.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" grad.apk --clobber
          else
            gh release create "$RELEASE_TAG" grad.apk --title "$RELEASE_TAG" --generate-notes
          fi
