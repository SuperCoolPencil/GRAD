name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v*'
      - 'test-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Validate build tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^(test-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not match vX.Y.Z or test-vX.Y.Z"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set app version from tag
        run: |
          tag_version="${RELEASE_TAG#test-v}"
          tag_version="${tag_version#v}"
          node -e 'const fs = require("fs"); const app = JSON.parse(fs.readFileSync("app.json", "utf8")); app.expo.version = process.argv[1]; fs.writeFileSync("app.json", `${JSON.stringify(app, null, 2)}\n`);' "$tag_version"
          test "$(node -p "require('./app.json').expo.version")" = "$tag_version"
          echo "Building app version $tag_version from tag $RELEASE_TAG"

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build signed Android APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PRODUCTION: '1'
        run: |
          test -n "$EXPO_TOKEN"
          eas build --local --platform android --profile production --non-interactive --output "$GITHUB_WORKSPACE/grad.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grad-apk-${{ env.RELEASE_TAG }}
          path: grad.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" grad.apk --clobber
          else
            gh release create "$RELEASE_TAG" grad.apk --title "$RELEASE_TAG" --generate-notes
          fi
